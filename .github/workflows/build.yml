# Compila e publica o site (GitHub Pages) a cada push.
name: Site

on:
  push:
    branches: [claude/nice-hawking-1x3urx, main]
    paths-ignore: ['README.md', 'tools/**', 'supabase/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Build do site (PWA)
        run: |
          npm run build
          mv dist site

      - name: Publicar no GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./site
