# Monta o baralho de flashcards (pasta flashcards/, arquivos .apkg do Anki) e publica o site (GitHub Pages).
# Para lançar baralhos: coloque os .apkg na pasta flashcards/ e diga a área em tools/cards-map.json.
name: Site

on:
  push:
    branches: [claude/nice-hawking-1x3urx, main]
    paths-ignore: ['README.md', 'supabase/**', 'tools/online-check.mjs']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Montar o baralho
        run: python tools/build_cards.py

      - name: Salvar no repositório o baralho montado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/cards
          if ! git diff --cached --quiet; then
            git commit -m "Baralho: flashcards montados automaticamente [skip ci]"
            git push
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Build do site (PWA)
        run: |
          npm run build
          mv dist site

      - name: Publicar no GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./site
